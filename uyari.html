<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erişim Engellendi</title>
    <style>
        /* GENEL AYARLAR */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Resim sığmazsa kenarlar siyah kalsın */
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        /* 1. MASAÜSTÜ İÇİN GÖRSEL AYARI */
        .tam-ekran-gorsel {
            width: 100%;
            height: 100%;
            object-fit: fill; /* Masaüstünde tam kaplasın */
            display: block;
        }

        /* 2. MASAÜSTÜ İÇİN LİNK KONUMU */
        .usom-link-alani {
            position: absolute;
            top: 77%;    
            left: 14%;   
            width: 18%;  
            height: 14%; 
            z-index: 99;
            cursor: pointer;
            /* Ayar yaparken kutuyu görmek için açabilirsin: */
            /* background-color: rgba(255, 0, 0, 0.5); */
        }

        /* === MOBİL CİHAZLAR İÇİN ÖZEL AYAR (EKRAN KÜÇÜKSE) === */
        @media screen and (max-width: 768px) {
            
            /* Mobilde resmi sıkıştırma, orantılı küçült ve ortala */
            .tam-ekran-gorsel {
                object-fit: contain; 
                object-position: center;
            }

            /* Mobilde Linkin Yerini Kaydır (Çünkü resim küçüldü) */
            .usom-link-alani {
                /* Bu değerleri telefonuna bakarak ince ayarlayabilirsin */
                top: 55%;    /* Resim ortalandığı için logo daha yukarı çıkar */
                left: 5%;    /* Mobilde biraz daha sola yanaşabilir */
                width: 35%;  /* Mobilde parmakla basmak için alanı genişletelim */
                height: 10%; 
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="Usom.jpg" alt="Erişim Engellendi" class="tam-ekran-gorsel">

        <a href="oyunlar.html" class="usom-link-alani"></a>
    </div>

</body>
</html>
