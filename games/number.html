<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>1–10 Sayı Tahmin Oyunu</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: radial-gradient(1200px 600px at 20% 10%, #0c1022 0%, #05060b 40%) fixed;
        color: #eaeaea;
        text-align: center;
        padding: 40px 10px;
    }

    h1 {
        color: #00eaff;
        text-shadow: 0 0 16px #00eaff;
        margin-bottom: 10px;
    }

    .box {
        max-width: 420px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 14px;
        padding: 20px;
        margin: 25px auto;
    }

    input, button {
        padding: 12px 18px;
        font-size: 18px;
        border-radius: 10px;
        border: none;
        margin: 10px;
        cursor: pointer;
        transition: 0.25s;
    }

    input {
        width: 140px;
        text-align: center;
        background: rgba(0,234,255,0.15);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.2);
    }

    button {
        background: rgba(0,234,255,0.18);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.15);
    }

    button:hover {
        background: rgba(0,234,255,0.35);
        box-shadow: 0 0 15px rgba(0,234,255,0.4);
    }

    #back {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 18px;
        color: #fff;
        text-decoration: none;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 10px;
    }

    #back:hover {
        background: rgba(0,234,255,0.2);
    }
</style>
</head>

<body>

<h1>🔢 Sayı Tahmin Oyunu</h1>
<p>Bir tur: <b>5 jeton</b></p>

<div class="box">

    <h3>Jeton: <span id="tokens">100</span></h3>

    <input id="guess" type="number" min="1" max="10" placeholder="1 - 10">
    <button onclick="play()">Tahmin Et</button>

    <h2 id="result"></h2>

</div>

<a id="back" href="/games">← Oyun Lobisine Dön</a>

<script>
let tokens = 100;
const TOKEN_COST = 5;

function play() {
    let guess = Number(document.getElementById("guess").value);
    const resultText = document.getElementById("result");

    if (!guess || guess < 1 || guess > 10) {
        resultText.innerText = "Lütfen 1–10 arasında bir sayı gir!";
        return;
    }

    if (tokens < TOKEN_COST) {
        resultText.innerText = "Jetonun yetersiz!";
        return;
    }

    tokens -= TOKEN_COST;
    document.getElementById("tokens").innerText = tokens;

    const random = Math.floor(Math.random() * 10) + 1;

    if (guess === random) {
        resultText.innerText = "Doğru bildin! (Jeton kazanılmaz)";
    } else {
        resultText.innerText = "Bilemedin! Doğru sayı: " + random;
    }
}
</script>

</body>
</html>
