<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Zar Tahmin | Hüseyin Sedat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
    :root{ --bg:#05060b; --neon:#00eaff; --glass:rgba(255,255,255,.06); --red:#ff4d4d; --green:#00ff88; }
    body { margin:0; padding:0; font-family:"Poppins",sans-serif; background:radial-gradient(1200px 600px at 20% 10%, #0c1022 0%, var(--bg) 40%) fixed; color:#eaeaea; text-align:center; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; }
    h1 { color:var(--neon); text-shadow:0 0 20px rgba(0, 234, 255, 0.6); margin-bottom:5px; font-size:2.5rem; }
    .container { position:relative; z-index:10; width:100%; max-width:500px; padding:20px; }
    .box { background:var(--glass); border:1px solid rgba(255,255,255,.1); backdrop-filter:blur(10px); border-radius:20px; padding:40px 20px; box-shadow:0 0 30px rgba(0,0,0,0.5); }
    .token-display { font-size:24px; background:rgba(0,0,0,0.3); padding:10px 20px; border-radius:50px; display:inline-block; margin-bottom:30px; border:1px solid rgba(255,255,255,0.1); }
    .dice-container { height:120px; display:flex; justify-content:center; align-items:center; margin:20px 0; }
    .dice { font-size:100px; color:#fff; text-shadow:0 0 30px var(--neon); transition:transform 0.5s ease-in-out; user-select:none; }
    .control-group { display:flex; gap:10px; justify-content:center; margin-top:20px; }
    select { padding:12px; font-size:18px; border-radius:10px; background:rgba(0,0,0,0.3); color:white; border:1px solid rgba(255,255,255,0.2); outline:none; width:80px; text-align:center; }
    button { padding:12px 30px; font-size:18px; font-weight:600; border-radius:10px; border:1px solid var(--neon); cursor:pointer; transition:0.3s; color:#000; background:var(--neon); box-shadow:0 0 15px rgba(0,234,255,0.4); }
    button:hover { background:#fff; box-shadow:0 0 25px rgba(255,255,255,0.6); transform:translateY(-2px); }
    #result { margin-top:25px; font-size:18px; font-weight:600; height:30px; }
    #back-btn { margin-top:30px; color:#a8b3bd; text-decoration:none; font-size:14px; transition:0.3s; display:inline-block; }
    #back-btn:hover { color:var(--neon); }
</style>
</head>
<body>
    <canvas id="bg" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;"></canvas>
    <div class="container">
        <h1>Zar Tahmin</h1>
        <p style="color:#aaa; margin-bottom:20px;">Giriş: <span style="color:var(--red)">5 Jeton</span> | Kazanç: <span style="color:var(--green)">25 Jeton</span></p>
        <div class="box">
            <div class="token-display">🪙 <span id="tokens">...</span></div>
            <div class="dice-container"><div class="dice" id="dice">🎲</div></div>
            <h2 id="result">1 ile 6 arası bir sayı tut!</h2>
            <div class="control-group">
                <select id="guess">
                    <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                    <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                </select>
                <button onclick="rollDice()">ZARI AT</button>
            </div>
        </div>
        <a href="../oyunlar.html" style="position: absolute; top: 20px; left: 20px; color: #a8b3bd; font-weight: bold; text-decoration: none; border: 1px solid rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 8px; font-family: sans-serif; transition: 0.3s;">
    ← Oyun Lobisine Dön
</a>
    </div>

<script>
    /* === 1. ORTAK CÜZDAN BAĞLANTISI === */
    var currentBalance = parseInt(localStorage.getItem("huseyin_bakiye")) || 100;
    document.getElementById("tokens").innerText = currentBalance;

    function updateGlobalWallet(newAmount) {
        currentBalance = newAmount;
        document.getElementById("tokens").innerText = currentBalance;
        localStorage.setItem("huseyin_bakiye", currentBalance);
    }

    /* === OYUN LOJİĞİ === */
    const COST = 5;
    const REWARD = 25; 
    let playCount = 0;
    let isRolling = false;
    const diceFaces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

    function rollDice() {
        if (isRolling) return;
        
        // Bakiye Kontrolü
        if (currentBalance < COST) {
            document.getElementById("result").style.color = "var(--red)";
            document.getElementById("result").innerText = "Yetersiz Jeton!";
            return;
        }

        const userGuess = parseInt(document.getElementById("guess").value);
        
        // Parayı düş ve kaydet
        updateGlobalWallet(currentBalance - COST);

        isRolling = true;
        document.getElementById("result").style.color = "#eaeaea";
        document.getElementById("result").innerText = "Zar atılıyor...";

        // Dönme Efekti
        let spinCount = 0;
        const spinning = setInterval(() => {
            document.getElementById("dice").innerText = diceFaces[Math.floor(Math.random() * 6)];
            document.getElementById("dice").style.transform = `rotate(${Math.random() * 20 - 10}deg) scale(1.1)`;
            spinCount++;
        }, 100);

        setTimeout(() => {
            clearInterval(spinning);
            playCount++;
            let finalNumber;
            
            // İlk 3 elde %50 şans (Oyuncuya kıyak)
            if (playCount <= 3) {
                finalNumber = (Math.random() < 0.5) ? userGuess : (Math.floor(Math.random() * 6) + 1);
            } else {
                finalNumber = Math.floor(Math.random() * 6) + 1;
            }

            document.getElementById("dice").innerText = diceFaces[finalNumber - 1];
            document.getElementById("dice").style.transform = "rotate(0deg) scale(1)";

            if (finalNumber === userGuess) {
                // Kazanınca parayı ekle ve kaydet
                updateGlobalWallet(currentBalance + REWARD);
                
                document.getElementById("result").style.color = "var(--green)";
                document.getElementById("result").innerText = `TEBRİKLER! ${finalNumber} geldi. (+${REWARD-COST} Jeton)`;
            } else {
                document.getElementById("result").style.color = "var(--red)";
                document.getElementById("result").innerText = `Maalesef ${finalNumber} geldi.`;
            }
            isRolling = false;
        }, 1500);
    }

    // Arka Plan
    const bg=document.getElementById("bg"),ctx=bg.getContext("2d");function resize(){bg.width=window.innerWidth;bg.height=window.innerHeight}resize();window.addEventListener("resize",resize);const dots=Array.from({length:40},()=>({x:Math.random()*bg.width,y:Math.random()*bg.height,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3}));function loop(){ctx.clearRect(0,0,bg.width,bg.height);ctx.fillStyle="#00eaff";dots.forEach(d=>{d.x+=d.vx;d.y+=d.vy;if(d.x<0||d.x>bg.width)d.vx*=-1;if(d.y<0||d.y>bg.height)d.vy*=-1;ctx.beginPath();ctx.arc(d.x,d.y,1.5,0,Math.PI*2);ctx.fill()});requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
