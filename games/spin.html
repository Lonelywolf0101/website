<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Spin Oyunu</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: radial-gradient(1200px 600px at 20% 10%, #0c1022 0%, #05060b 40%) fixed;
        color: #eaeaea;
        text-align: center;
        padding: 40px 10px;
    }

    h1 {
        color: #00eaff;
        text-shadow: 0 0 16px #00eaff;
    }

    .box {
        max-width: 480px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 14px;
        padding: 20px;
        margin: 25px auto;
    }

    .wheel {
        width: 260px;
        height: 260px;
        border-radius: 50%;
        border: 10px solid rgba(255,255,255,0.4);
        margin: 20px auto;
        position: relative;
        overflow: hidden;
        transition: transform 4s cubic-bezier(.17,.67,.45,1);
        box-shadow: 0 0 20px rgba(0,234,255,0.4);
    }

    .segment {
        position: absolute;
        width: 50%;
        height: 50%;
        transform-origin: 100% 100%;
        clip-path: polygon(0 0, 100% 0, 100% 100%);
    }

    button {
        padding: 12px 20px;
        font-size: 18px;
        border-radius: 10px;
        background: rgba(0,234,255,0.18);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.15);
        cursor: pointer;
        margin: 10px;
        transition: 0.3s;
    }

    button:hover {
        background: rgba(0,234,255,0.35);
        box-shadow: 0 0 18px rgba(0,234,255,0.4);
    }

    #back {
        display: inline-block;
        margin-top: 18px;
        padding: 10px 18px;
        color: #fff;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 10px;
        text-decoration: none;
    }

    #back:hover {
        background: rgba(0,234,255,0.2);
    }
</style>
</head>

<body>

<h1>🎰 Spin / Çark Oyunu</h1>
<p>Bir spin: <b>10 jeton</b></p>

<div class="box">

    <h3>Jeton: <span id="tokens">100</span></h3>

    <button onclick="setGuess('Kırmızı')">🔴 Kırmızı</button>
    <button onclick="setGuess('Mavi')">🔵 Mavi</button>

    <p>Seçilen: <b id="guessText">Yok</b></p>

    <div class="wheel" id="wheel">
        <!-- 4 Dilim (2 kırmızı, 2 mavi) -->
        <div class="segment" style="background:red; transform: rotate(0deg) skewY(-30deg);"></div>
        <div class="segment" style="background:blue; transform: rotate(90deg) skewY(-30deg);"></div>
        <div class="segment" style="background:red; transform: rotate(180deg) skewY(-30deg);"></div>
        <div class="segment" style="background:blue; transform: rotate(270deg) skewY(-30deg);"></div>
    </div>
