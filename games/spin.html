<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="canonical" href="https://huseyinsedat.com/games/spin.html">
    <meta property="og:title" content="spin.html">
    <meta property="og:description" content="Politika riski nedeniyle indekslenmeyen sayfa.">
    <meta name="twitter:card" content="summary">
<meta charset="UTF-8">
<title>Spin Çarkı | Hüseyin Sedat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
    :root{ --bg:#05060b; --neon:#00eaff; --glass:rgba(255,255,255,.06); --red:#ff4d4d; --green:#00ff88; }
    body { margin:0; padding:0; font-family:"Poppins",sans-serif; background:radial-gradient(1200px 600px at 20% 10%, #0c1022 0%, var(--bg) 40%) fixed; color:#eaeaea; text-align:center; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; overflow-x:hidden; }
    h1 { color:var(--neon); text-shadow:0 0 20px rgba(0, 234, 255, 0.6); margin-bottom:5px; font-size:2.5rem; }
    .container { position:relative; z-index:10; width:100%; max-width:500px; padding:20px; }
    .box { background:var(--glass); border:1px solid rgba(255,255,255,.1); backdrop-filter:blur(10px); border-radius:20px; padding:30px 20px; box-shadow:0 0 30px rgba(0,0,0,0.5); }
    .token-display { font-size:24px; background:rgba(0,0,0,0.3); padding:10px 20px; border-radius:50px; display:inline-block; margin-bottom:20px; border:1px solid rgba(255,255,255,0.1); }
    .wheel-wrapper { position:relative; width:280px; height:280px; margin:20px auto; }
    .pointer { position:absolute; top:-15px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:15px solid transparent; border-right:15px solid transparent; border-top:30px solid #fff; z-index:20; filter:drop-shadow(0 0 10px var(--neon)); }
    .wheel { width:100%; height:100%; border-radius:50%; border:8px solid rgba(255,255,255,0.1); background:conic-gradient(#ff4d4d 0deg 60deg, #00eaff 60deg 120deg, #00ff88 120deg 180deg, #ffd700 180deg 240deg, #9d00ff 240deg 300deg, #ff9100 300deg 360deg); transition:transform 4s cubic-bezier(0.1, 0.6, 0.1, 1); box-shadow:0 0 30px rgba(0,0,0,0.5); }
    .controls { display:flex; gap:10px; justify-content:center; margin-top:20px; flex-wrap:wrap; }
    select { padding:12px; font-size:18px; border-radius:10px; background:rgba(0,0,0,0.3); color:white; border:1px solid rgba(255,255,255,0.2); outline:none; width:140px; text-align:center; cursor:pointer; }
    option { background:#000; }
    button { padding:12px 30px; font-size:18px; font-weight:600; border-radius:10px; border:1px solid var(--neon); cursor:pointer; transition:0.3s; color:#000; background:var(--neon); box-shadow:0 0 15px rgba(0,234,255,0.4); }
    button:hover { background:#fff; box-shadow:0 0 25px rgba(255,255,255,0.6); transform:translateY(-2px); }
    #result { margin-top:25px; font-size:18px; font-weight:600; height:30px; }
    #back-btn { margin-top:30px; color:#a8b3bd; text-decoration:none; font-size:14px; transition:0.3s; display:inline-block; }
    #back-btn:hover { color:var(--neon); }
</style>
</head>
<body>
    <canvas id="bg" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;"></canvas>
    <div class="container">
        <h1>Renkli Çark</h1>
        <p style="color:#aaa; margin-bottom:20px;">Giriş: <span style="color:var(--red)">10 Jeton</span> | Kazanç: <span style="color:var(--green)">50 Jeton</span></p>
        <div class="box">
            <div class="token-display">🪙 <span id="tokens">...</span></div>
            <div class="wheel-wrapper"><div class="pointer"></div><div class="wheel" id="wheel"></div></div>
            <h2 id="result">Bir renk seç ve çevir!</h2>
            <div class="controls">
                <select id="guess">
                    <option value="red">🔴 Kırmızı</option><option value="blue">🔵 Mavi</option>
                    <option value="green">🟢 Yeşil</option><option value="yellow">🟡 Sarı</option>
                    <option value="purple">🟣 Mor</option><option value="orange">🟠 Turuncu</option>
                </select>
                <button onclick="spin()">ÇEVİR</button>
            </div>
        </div>
       <a href="../oyunlar.html" style="position: absolute; top: 20px; left: 20px; color: #a8b3bd; font-weight: bold; text-decoration: none; border: 1px solid rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 8px; font-family: sans-serif; transition: 0.3s;">
    ← Oyun Lobisine Dön
</a>
    </div>

<script>
    /* === 1. ORTAK CÜZDAN BAĞLANTISI === */
    // Ana Kasadan veriyi çek
    var currentBalance = parseInt(localStorage.getItem("huseyin_bakiye")) || 100;
    document.getElementById("tokens").innerText = currentBalance;

    // Bakiyeyi güncelleyen ve kaydeden fonksiyon
    function updateGlobalWallet(newAmount) {
        currentBalance = newAmount;
        document.getElementById("tokens").innerText = currentBalance;
        localStorage.setItem("huseyin_bakiye", currentBalance);
    }

    /* === OYUN LOJİĞİ === */
    const COST = 10;
    const REWARD = 50;
    let playCount = 0;
    let isSpinning = false;
    const slices = [ 
        { color:"red", min:0, max:60 }, 
        { color:"blue", min:60, max:120 }, 
        { color:"green", min:120, max:180 }, 
        { color:"yellow", min:180, max:240 }, 
        { color:"purple", min:240, max:300 }, 
        { color:"orange", min:300, max:360 } 
    ];

    function spin() {
        if (isSpinning) return;
        
        // Bakiye Kontrolü
        if (currentBalance < COST) { 
            document.getElementById("result").style.color = "var(--red)"; 
            document.getElementById("result").innerText = "Yetersiz Jeton!"; 
            return; 
        }

        const userGuess = document.getElementById("guess").value;
        
        // Ücreti düş ve kaydet
        updateGlobalWallet(currentBalance - COST);

        isSpinning = true;
        document.getElementById("result").style.color = "#eaeaea";
        document.getElementById("result").innerText = "Çark dönüyor...";

        playCount++;
        let targetColorObj;
        
        // Kazanma ihtimali (İlk 3 el %50, sonra %16)
        let winChance = (playCount <= 3) ? 0.5 : 0.16;
        
        if (Math.random() < winChance) {
            // Kazanacaksa seçtiği rengi hedefle
            targetColorObj = slices.find(s => s.color === userGuess);
        } else {
            // Kaybedecekse seçmediği bir rengi hedefle
            let otherSlices = slices.filter(s => s.color !== userGuess);
            targetColorObj = otherSlices[Math.floor(Math.random() * otherSlices.length)];
        }

        // Derece Hesaplama (Pointer en üstte, yani 0 derecede kabul edilir)
        // Hedeflenen dilimi 0 noktasına (en tepeye) getirmek için gereken dönüşü hesaplıyoruz
        const randomDegreeInSlice = Math.floor(Math.random() * (targetColorObj.max - targetColorObj.min - 20)) + targetColorObj.min + 10;
        let stopAngle = (360 - randomDegreeInSlice); 
        let finalRotation = (360 * 8) + stopAngle; // 8 tam tur + hedef açı

        const wheel = document.getElementById("wheel");
        wheel.style.transition = "none";
        wheel.style.transform = `rotate(0deg)`;

        // Animasyonu başlat
        setTimeout(() => {
            wheel.style.transition = "transform 4s cubic-bezier(0.1, 0.6, 0.1, 1)";
            wheel.style.transform = `rotate(${finalRotation}deg)`;
        }, 50);

        // Sonuç
        setTimeout(() => {
            if (targetColorObj.color === userGuess) {
                // Kazanınca parayı ekle ve kaydet
                updateGlobalWallet(currentBalance + REWARD);
                
                document.getElementById("result").style.color = "var(--green)";
                document.getElementById("result").innerText = `TEBRİKLER! ${translateColor(userGuess)} geldi!`;
            } else {
                document.getElementById("result").style.color = "var(--red)";
                document.getElementById("result").innerText = `Kaybettin! ${translateColor(targetColorObj.color)} geldi.`;
            }
            isSpinning = false;
        }, 4100);
    }

    function translateColor(eng) { const map = { "red": "Kırmızı", "blue": "Mavi", "green": "Yeşil", "yellow": "Sarı", "purple": "Mor", "orange": "Turuncu" }; return map[eng] || eng; }
    
    // Arka Plan
    const bg=document.getElementById("bg"),ctx=bg.getContext("2d");function resize(){bg.width=window.innerWidth;bg.height=window.innerHeight}resize();window.addEventListener("resize",resize);const dots=Array.from({length:40},()=>({x:Math.random()*bg.width,y:Math.random()*bg.height,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3}));function loop(){ctx.clearRect(0,0,bg.width,bg.height);ctx.fillStyle="#00eaff";dots.forEach(d=>{d.x+=d.vx;d.y+=d.vy;if(d.x<0||d.x>bg.width)d.vx*=-1;if(d.y<0||d.y>bg.height)d.vy*=-1;ctx.beginPath();ctx.arc(d.x,d.y,1.5,0,Math.PI*2);ctx.fill()});requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
