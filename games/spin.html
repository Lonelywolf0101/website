<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Spin Çarkı</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: radial-gradient(1200px 600px at 20% 10%, #0c1022 0%, #05060b 40%) fixed;
        color: #eaeaea;
        text-align: center;
        padding: 30px 10px;
    }

    .game-header {
        max-width: 600px;
        margin: 0 auto 25px;
        padding: 18px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(0,234,255,0.25);
        border-radius: 14px;
        display: flex;
        align-items: center;
        gap: 14px;
        justify-content: center;
        box-shadow: 0 0 18px rgba(0,234,255,0.2);
    }

    .game-icon { font-size: 48px; }
    .game-title { font-size: 28px; color: #00eaff; font-weight: 600; }

    .wheel-container {
        position: relative;
        width: 300px;
        height: 300px;
        margin: 30px auto;
    }

    /* ÇARKIN ÜSTÜNDE, AŞAĞI BAKAN OK */
    .pointer {
        position: absolute;
        top: -20px;              /* çarkın tam üst yanı */
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 22px solid transparent;
        border-right: 22px solid transparent;
        border-bottom: 35px solid yellow;  /* aşağı bakan üçgen */
        filter: drop-shadow(0 0 10px yellow);
        z-index: 10;
    }

    /* Çark arka plan */
    .wheel {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 10px solid rgba(255,255,255,0.15);
        background-image: conic-gradient(
            red 0deg 60deg,
            blue 60deg 120deg,
            green 120deg 180deg,
            yellow 180deg 240deg,
            purple 240deg 300deg,
            orange 300deg 360deg
        );
        transition: transform 4s cubic-bezier(.1,.6,.1,1);
    }

    button {
        padding: 12px 20px;
        font-size: 18px;
        border-radius: 10px;
        border: none;
        margin: 10px;
        cursor: pointer;
        background: rgba(0,234,255,0.2);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.18);
        transition: .25s;
    }
    button:hover {
        background: rgba(0,234,255,0.35);
    }

    #back {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 18px;
        color: #fff;
        text-decoration: none;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 10px;
    }
</style>

</head>
<body>

<div class="game-header">
    <div class="game-icon">🎡</div>
    <div class="game-title">Renkli Spin Çarkı</div>
</div>

<h3>Jeton: <span id="tokens">100</span></h3>
<p>Bir tur: <b>10 jeton</b></p>

<h3>Tahmin Et:</h3>
<select id="guess">
    <option value="red">Kırmızı</option>
    <option value="blue">Mavi</option>
    <option value="green">Yeşil</option>
    <option value="yellow">Sarı</option>
    <option value="purple">Mor</option>
    <option value="orange">Turuncu</option>
</select>

<div class="wheel-container">
    <div class="wheel" id="wheel"></div>
    <div class="pointer"></div>
</div>

<button onclick="spin()">🎲 Çevir</button>

<h2 id="result"></h2>

<a id="back" href="/games">← Oyun Lobisine Dön</a>

<script>
let tokens = 100;
const COST = 10;
let spinning = false;

// Dilimlerin renk aralıkları (0–360)
const slices = [
  { color: "red",    start:   0, end:  60 },
  { color: "blue",   start:  60, end: 120 },
  { color: "green",  start: 120, end: 180 },
  { color: "yellow", start: 180, end: 240 },
  { color: "purple", start: 240, end: 300 },
  { color: "orange", start: 300, end: 360 }
];

function getColorByAngle(angle) {
    // çark saat yönünde döndüğü için açı tersine çevrilir
    angle = (360 - angle + 360) % 360;
    for (let slice of slices) {
        if (angle >= slice.start && angle < slice.end) return slice.color;
    }
    return "red";
}

function spin() {
    if (spinning) return;

    if (tokens < COST) {
        document.getElementById("result").innerText = "Jetonun yetersiz!";
        return;
    }

    spinning = true;
    tokens -= COST;
    document.getElementById("tokens").innerText = tokens;

    const wheel = document.getElementById("wheel");
    document.getElementById("result").innerText = "Çark dönüyor...";

    // 1) Her seferinde çarkı 0°'ye resetle (aynı hız/mesafe hissi)
    wheel.style.transition = "none";
    wheel.style.transform = "rotate(0deg)";

    // 2) Sonraki frame'de animasyonlu dönüşü başlat
    setTimeout(() => {
        // 10 tam tur + 0–360 arası rastgele
        const randomRotation = 360 * 10 + Math.floor(Math.random() * 360);

        wheel.style.transition = "transform 4s cubic-bezier(.1,.6,.1,1)";
        wheel.style.transform = `rotate(${randomRotation}deg)`;

        setTimeout(() => {
            const normalized = randomRotation % 360;
            const resultColor = getColorByAngle(normalized);
            const guess = document.getElementById("guess").value;

            if (resultColor === guess) {
                document.getElementById("result").innerText =
                    `Tebrikler! Doğru bildin → ${resultColor}`;
            } else {
                document.getElementById("result").innerText =
                    `Bilemedin! Çıkan: ${resultColor}`;
            }

            spinning = false;
        }, 4100);
    }, 20);
}
</script>

</body>
</html>
