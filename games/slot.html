<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Slot Makinesi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: #0c0f1a;
        color: #eaeaea;
        text-align: center;
        padding: 30px 10px;
    }

    h1 {
        color: #00eaff;
        font-size: 34px;
    }

    .box {
        max-width: 450px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 25px;
        margin: 30px auto;
    }

    /* Slot alanı */
    .slot-container {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin: 25px 0;
    }

    .reel {
        width: 90px;
        height: 120px;
        overflow: hidden;
        border-radius: 12px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 0 14px rgba(0,234,255,0.25);
        position: relative;
    }

    .reel-strip {
        position: absolute;
        top: -360px; /* animasyon başlangıcında aşağı kayacak */
        width: 100%;
        display: flex;
        flex-direction: column;
        transition: top 1s ease-out;
    }

    .symbol {
        font-size: 48px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    button {
        padding: 12px 24px;
        font-size: 20px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        background: #004a56;
        color: #fff;
        margin-top: 10px;
    }

    button:hover {
        background: #007083;
    }
</style>
</head>

<body>

<h1>🎰 Slot Makinesi</h1>

<div class="box">
    <h2>Jeton: <span id="tokens">100</span></h2>
    <p>Bir tur: <b>10 jeton</b></p>

    <div class="slot-container">
        <div class="reel"><div class="reel-strip" id="r1"></div></div>
        <div class="reel"><div class="reel-strip" id="r2"></div></div>
        <div class="reel"><div class="reel-strip" id="r3"></div></div>
    </div>

    <button onclick="spin()">Çevir</button>

    <h2 id="result"></h2>
</div>

<a id="back" href="/games" style="color:#9df;">← Oyun Lobisine Dön</a>

<script>
let tokens = 100;
const COST = 10;

const symbols = ["🍒", "⭐", "🍋", "🍉", "🔔", "🍇"];

function buildReel(strip) {
    strip.innerHTML = "";

    // Reel’in içinde 5 tur uzunluğunda sembol listesi
    for (let i = 0; i < 12; i++) {
        let sym = document.createElement("div");
        sym.className = "symbol";
        sym.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        strip.appendChild(sym);
    }
}

function spin() {
    if (tokens < COST) {
        result.innerText = "Jetonun bitti!";
        return;
    }

    tokens -= COST;
    document.getElementById("tokens").innerText = tokens;

    let r1 = document.getElementById("r1");
    let r2 = document.getElementById("r2");
    let r3 = document.getElementById("r3");

    let resultText = document.getElementById("result");
    resultText.innerText = "";

    // Reel’i yeniden oluştur (her spin farklı)
    buildReel(r1);
    buildReel(r2);
    buildReel(r3);

    // Her reel için rastgele durma konumu
    let stop1 = -(Math.floor(Math.random() * 6) * 120);
    let stop2 = -(Math.floor(Math.random() * 6) * 120);
    let stop3 = -(Math.floor(Math.random() * 6) * 120);

    // İlk animasyon (hızlı aşağı akma)
    r1.style.transition = "top 0s";
    r2.style.transition = "top 0s";
    r3.style.transition = "top 0s";

    r1.style.top = "-720px";
    r2.style.top = "-720px";
    r3.style.top = "-720px";

    setTimeout(() => {
        // Yavaşlayarak durma animasyonu
        r1.style.transition = "top 1.2s ease-out";
        r2.style.transition = "top 1.4s ease-out";
        r3.style.transition = "top 1.6s ease-out";

        r1.style.top = stop1 + "px";
        r2.style.top = stop2 + "px";
        r3.style.top = stop3 + "px";

        setTimeout(() => {
            // Kazanıp kazanmadığını kontrol et
            let s1 = r1.children[Math.abs(stop1 / 120)].innerText;
            let s2 = r2.children[Math.abs(stop2 / 120)].innerText;
            let s3 = r3.children[Math.abs(stop3 / 120)].innerText;

            if (s1 === s2 && s2 === s3) {
                resultText.innerText = "Kazandın!";
            } else {
                resultText.innerText = "Kaybettin!";
            }
        }, 1700);

    }, 50);
}
</script>

</body>
</html>
