<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Slot Makinesi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: radial-gradient(1200px 600px at 20% 10%, #0c1022 0%, #05060b 40%) fixed;
        color: #eaeaea;
        text-align: center;
        padding: 40px 10px;
    }

    h1 {
        color: #00eaff;
        text-shadow: 0 0 16px #00eaff;
        font-size: 36px;
        margin-bottom: 10px;
    }

    .box {
        max-width: 420px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 14px;
        padding: 25px;
        margin: 25px auto;
    }

    /* Slot makinesi görseli */
    .slot-machine {
        width: 240px;
        display: block;
        margin: 0 auto;
        margin-bottom: -10px;
        transform: translateY(10px);
        filter: drop-shadow(0 0 12px rgba(0,234,255,0.25));
    }

    /* Sonuç kutuları */
    .slots {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-top: 25px;
    }

    .slot-box {
        width: 85px;
        height: 85px;
        background: rgba(0, 234, 255, 0.15);
        border-radius: 14px;
        box-shadow: 0 0 14px rgba(0,234,255,0.25);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 46px;
    }

    /* Çevir butonu */
    button {
        padding: 12px 22px;
        font-size: 22px;
        border-radius: 12px;
        border: none;
        margin-top: 25px;
        cursor: pointer;
        transition: 0.25s;
        background: #004a56;
        color: #fff;
        border: 1px solid rgba(255,255,255,0.15);
    }

    button:hover {
        background: #006d80;
        box-shadow: 0 0 15px rgba(0,234,255,0.4);
    }

    #back {
        display: inline-block;
        margin-top: 25px;
        padding: 10px 18px;
        color: #fff;
        text-decoration: none;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 10px;
    }

    #back:hover {
        background: rgba(0,234,255,0.2);
    }
</style>
</head>

<body>

<h1>🎰 Slot Makinesi</h1>

<div class="box">
    <h2>Jeton: <span id="tokens">100</span></h2>
    <p>Bir tur: <b>10 jeton</b></p>

    <!-- SLOT MAKİNESİ GÖRSELİ -->
    <img src="slot.png" class="slot-machine">

    <!-- SLOT SONUÇLARI -->
    <div class="slots">
        <div class="slot-box" id="s1">🍒</div>
        <div class="slot-box" id="s2">🍋</div>
        <div class="slot-box" id="s3">⭐</div>
    </div>

    <button onclick="spin()">🎲 Çevir</button>

    <h2 id="result"></h2>
</div>

<a id="back" href="/games">← Oyun Lobisine Dön</a>

<script>
let tokens = 100;
const COST = 10;

const symbols = ["🍒", "🍋", "🍉", "⭐", "🔔", "🍇"];

function spin() {
    if (tokens < COST) {
        document.getElementById("result").innerText = "Jetonun bitti!";
        return;
    }

    tokens -= COST;
    document.getElementById("tokens").innerText = tokens;
    document.getElementById("result").innerText = "Çevriliyor...";

    // Hafif animasyon efekti
    document.getElementById("s1").style.opacity = "0.3";
    document.getElementById("s2").style.opacity = "0.3";
    document.getElementById("s3").style.opacity = "0.3";

    setTimeout(() => {
        let r1 = symbols[Math.floor(Math.random() * symbols.length)];
        let r2 = symbols[Math.floor(Math.random() * symbols.length)];
        let r3 = symbols[Math.floor(Math.random() * symbols.length)];

        document.getElementById("s1").innerText = r1;
        document.getElementById("s2").innerText = r2;
        document.getElementById("s3").innerText = r3;

        document.getElementById("s1").style.opacity = "1";
        document.getElementById("s2").style.opacity = "1";
        document.getElementById("s3").style.opacity = "1";

        if (r1 === r2 && r2 === r3 && r1 === r3) {
            document.getElementById("result").innerText = "Kazandın! (Jeton verilmez)";
        } else {
            document.getElementById("result").innerText = "Kaybettin!";
        }

    }, 700);
}
</script>

</body>
</html>
