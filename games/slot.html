<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Slot Makinesi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: #0c0f1a;
        color: #eaeaea;
        text-align: center;
        padding: 30px 10px;
    }

    h1 {
        color: #00eaff;
        font-size: 34px;
    }

    .box {
        max-width: 520px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 25px;
        margin: 30px auto;
    }

    /* --- SLOT GÖRSELİ KAPSAYICISI --- */
    .machine-wrapper {
        position: relative;
        width: 350px;      /* Slot görüntüsünün boyutu (responsive) */
        margin: 0 auto;
    }

    .slot-machine {
        width: 100%;
        display: block;
    }

    /* --- SLOTLARIN GÖRSELİN ÜZERİNE BİNEN KONUMU --- */
    .slots {
        position: absolute;
        top: 66%;       /* Yükseklik konumu (görsele göre mükemmel hizalı) */
        left: 50%;
        transform: translate(-50%, -50%);
        width: 70%;     /* Pencere genişliği */
        display: flex;
        justify-content: space-between;
    }

    .slot-box {
        width: 30%;
        aspect-ratio: 1 / 1; /* Kare kutu */
        background: rgba(0, 234, 255, 0.18);
        border-radius: 12px;
        box-shadow: 0 0 14px rgba(0,234,255,0.25);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 42px;
        backdrop-filter: blur(3px);
    }

    /* --- BUTON --- */
    button {
        padding: 12px 24px;
        font-size: 20px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        background: #004a56;
        color: #fff;
        margin-top: 35px;
    }

    button:hover {
        background: #007083;
    }

    #back {
        display: inline-block;
        margin-top: 25px;
        padding: 8px 18px;
        color: #fff;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 10px;
        text-decoration: none;
    }
</style>
</head>

<body>

<h1>🎰 Slot Makinesi</h1>

<div class="box">
    <h2>Jeton: <span id="tokens">100</span></h2>
    <p>Bir tur: <b>10 jeton</b></p>

    <div class="machine-wrapper">

        <!-- SLOT GÖRSELİ -->
        <img src="slot.png" class="slot-machine">

        <!-- Slot Pencereleri (Tam Oturan) -->
        <div class="slots">
            <div class="slot-box" id="s1">🍉</div>
            <div class="slot-box" id="s2">⭐</div>
            <div class="slot-box" id="s3">🍒</div>
        </div>
    </div>

    <button onclick="spin()">Çevir</button>

    <h2 id="result"></h2>
</div>

<a id="back" href="/games">← Oyun Lobisine Dön</a>

<script>
let tokens = 100;
const COST = 10;

const symbols = ["🍒","🍋","🍉","⭐","🔔","🍇"];

function spin() {
    if (tokens < COST) {
        result.innerText = "Jetonun bitti!";
        return;
    }

    tokens -= COST;
    tokensEl = document.getElementById("tokens").innerText = tokens;

    let s1 = document.getElementById("s1");
    let s2 = document.getElementById("s2");
    let s3 = document.getElementById("s3");
    let resultText = document.getElementById("result");

    resultText.innerText = "Çevriliyor...";
    s1.style.opacity = s2.style.opacity = s3.style.opacity = "0.3";

    setTimeout(() => {
        let r1 = symbols[Math.floor(Math.random()*symbols.length)];
        let r2 = symbols[Math.floor(Math.random()*symbols.length)];
        let r3 = symbols[Math.floor(Math.random()*symbols.length)];

        s1.innerText = r1;
        s2.innerText = r2;
        s3.innerText = r3;

        s1.style.opacity = s2.style.opacity = s3.style.opacity = "1";

        if (r1 === r2 && r2 === r3) {
            resultText.innerText = "Kazandın!";
        } else {
            resultText.innerText = "Kaybettin!";
        }

    }, 700);
}
</script>

</body>
</html>
