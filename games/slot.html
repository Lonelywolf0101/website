<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Slot Makinesi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: radial-gradient(1200px 600px at 20% 10%, #0c1022 0%, #05060b 40%) fixed;
        color: #eaeaea;
        text-align: center;
        padding: 40px 10px;
    }

    h1 {
        color: #00eaff;
        text-shadow: 0 0 16px #00eaff;
        margin-bottom: 20px;
    }

    .box {
        max-width: 420px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 16px;
        padding: 25px;
        margin: 25px auto;
        position: relative;
    }

    /* ========== SLOT MAKİNESİ GÖRSELİ ========== */
    .machine-wrapper {
        position: relative;
        width: 270px;
        margin: 0 auto;
    }

    .slot-machine {
        width: 100%;
        filter: drop-shadow(0 0 12px rgba(0,234,255,0.25));
        display: block;
    }

    /* ========== MAKİNENİN İÇİNE OTURAN SLOTLAR ========== */
    .slots {
        position: absolute;
        top: 75px;       /* slot penceresinin dikey konumu (görsele göre ayarlanmış) */
        left: 50%;
        transform: translateX(-50%);
        width: 180px;   /* pencere genişliği */
        display: flex;
        justify-content: space-between;
    }

    .slot-box {
        width: 55px;
        height: 55px;
        background: rgba(0, 234, 255, 0.15);
        border-radius: 10px;
        box-shadow: 0 0 12px rgba(0,234,255,0.25);
        font-size: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(4px);
    }

    /* ========== BUTON ========== */
    button {
        margin-top: 190px;
        padding: 12px 22px;
        font-size: 22px;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        background: #004a56;
        color: #fff;
        transition: 0.25s;
    }

    button:hover {
        background: #006d80;
        box-shadow: 0 0 15px rgba(0,234,255,0.4);
    }

    #back {
        display: inline-block;
        margin-top: 20px;
        padding: 8px 18px;
        color: #fff;
        text-decoration: none;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 10px;
    }

    #back:hover {
        background: rgba(0,234,255,0.2);
    }
</style>
</head>

<body>

<h1>🎰 Slot Makinesi</h1>

<div class="box">
    <h2>Jeton: <span id="tokens">100</span></h2>
    <p>Bir tur: <b>10 jeton</b></p>

    <!-- SLOT MAKİNESİ KAPSAYICI -->
    <div class="machine-wrapper">

        <!-- MAKİNE GÖRSELİ -->
        <img src="slot.png" class="slot-machine">

        <!-- MAKİNENİN İÇİNE YERLEŞEN SLOT KUTULARI -->
        <div class="slots">
            <div class="slot-box" id="s1">🍒</div>
            <div class="slot-box" id="s2">🍋</div>
            <div class="slot-box" id="s3">⭐</div>
        </div>
    </div>

    <button onclick="spin()">Çevir</button>

    <h2 id="result"></h2>
</div>

<a id="back" href="/games">← Oyun Lobisine Dön</a>

<script>
let tokens = 100;
const COST = 10;
const symbols = ["🍒", "🍋", "🍉", "⭐", "🔔", "🍇"];

function spin() {
    if (tokens < COST) {
        result.innerText = "Jetonun bitti!";
        return;
    }

    tokens -= COST;
    document.getElementById("tokens").innerText = tokens;
    document.getElementById("result").innerText = "Çevriliyor...";

    let s1 = document.getElementById("s1");
    let s2 = document.getElementById("s2");
    let s3 = document.getElementById("s3");

    s1.style.opacity = s2.style.opacity = s3.style.opacity = "0.3";

    setTimeout(() => {
        let r1 = symbols[Math.floor(Math.random()*symbols.length)];
        let r2 = symbols[Math.floor(Math.random()*symbols.length)];
        let r3 = symbols[Math.floor(Math.random()*symbols.length)];

        s1.innerText = r1;
        s2.innerText = r2;
        s3.innerText = r3;

        s1.style.opacity = s2.style.opacity = s3.style.opacity = "1";

        if (r1 === r2 && r2 === r3) {
            result.innerText = "Kazandın! (Jeton verilmez)";
        } else {
            result.innerText = "Kaybettin!";
        }
    }, 700);
}
</script>

</body>
</html>
