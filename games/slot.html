<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Klasik Slot Makinesi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: radial-gradient(1200px 600px at 20% 10%, #0c1022 0%, #05060b 40%) fixed;
        color: #eaeaea;
        text-align: center;
        padding: 30px 10px;
    }

    .game-header {
        max-width: 600px;
        margin: 0 auto 25px;
        padding: 18px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(0,234,255,0.25);
        border-radius: 14px;
        display: flex;
        align-items: center;
        gap: 14px;
        justify-content: center;
        box-shadow: 0 0 18px rgba(0,234,255,0.2);
    }

    .game-header .game-icon {
        font-size: 48px;
    }

    .game-header .game-title {
        font-size: 28px;
        color: #00eaff;
        font-weight: 600;
    }

    .machine {
        margin: 30px auto;
        padding: 25px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 16px;
        width: 330px;
        box-shadow: 0 0 18px rgba(0,234,255,0.18);
    }

    .reels {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 20px;
    }

    .reel {
        width: 80px;
        height: 80px;
        border-radius: 12px;
        background: #111;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size: 42px;
        color: #fff;
        border: 2px solid rgba(0,234,255,0.35);
        box-shadow: inset 0 0 12px rgba(0,234,255,0.4);
        transition: transform 0.2s;
    }

    button {
        padding: 12px 20px;
        font-size: 18px;
        border-radius: 10px;
        border: none;
        margin: 10px;
        cursor: pointer;
        background: rgba(0,234,255,0.2);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.18);
        transition: .25s;
    }
    button:hover {
        background: rgba(0,234,255,0.35);
    }

    #back {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 18px;
        color: #fff;
        text-decoration: none;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 10px;
    }
</style>

</head>
<body>

<div class="game-header">
    <div class="game-icon">🎰</div>
    <div class="game-title">Slot Makinesi</div>
</div>

<h3>Jeton: <span id="tokens">100</span></h3>
<p>Bir tur: <b>10 jeton</b></p>

<div class="machine">
    <div class="reels">
        <div class="reel" id="r1">🍒</div>
        <div class="reel" id="r2">🍋</div>
        <div class="reel" id="r3">⭐</div>
    </div>

    <button onclick="spin()">🎲 Çevir</button>

    <h2 id="result"></h2>
</div>

<a id="back" href="/games">← Oyun Lobisine Dön</a>

<script>
let tokens = 100;
const COST = 10;
const symbols = ["🍒", "🍋", "⭐", "🍉", "🔔", "7️⃣"];

function spin() {
    if (tokens < COST) {
        document.getElementById("result").innerText = "Jetonun yetersiz!";
        return;
    }

    tokens -= COST;
    document.getElementById("tokens").innerText = tokens;

    const r1 = document.getElementById("r1");
    const r2 = document.getElementById("r2");
    const r3 = document.getElementById("r3");
    const result = document.getElementById("result");

    result.innerText = "Çevriliyor...";

    // Rastgele sonuçlar
    let s1 = symbols[Math.floor(Math.random()*symbols.length)];
    let s2 = symbols[Math.floor(Math.random()*symbols.length)];
    let s3 = symbols[Math.floor(Math.random()*symbols.length)];

    // Animasyon
    r1.style.transform = "rotateX(360deg)";
    r2.style.transform = "rotateX(360deg)";
    r3.style.transform = "rotateX(360deg)";

    setTimeout(()=> r1.innerText = s1, 300);
    setTimeout(()=> r2.innerText = s2, 600);
    setTimeout(()=> r3.innerText = s3, 900);

    setTimeout(()=> {
        r1.style.transform = "rotateX(0deg)";
        r2.style.transform = "rotateX(0deg)";
        r3.style.transform = "rotateX(0deg)";

        if (s1 === s2 && s2 === s3) {
            result.innerText = `⭐ JACKPOT! (${s1} ${s2} ${s3})`;
        } else if (s1 === s2 && s2 === s3 && s1 === s3) {
            result.innerText = `Kazandın! (Ama jeton verilmiyor)`;
        } else {
            result.innerText = "Kaybettin!";
        }

    }, 1100);
}
</script>

</body>
</html>
