<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Slot Makinesi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body{
        margin:0;
        padding:0;
        font-family:"Poppins",system-ui,sans-serif;
        background:#05060b;
        color:#eaeaea;
        text-align:center;
        padding:30px 10px;
    }
    h1{
        color:#00eaff;
        font-size:34px;
        text-shadow:0 0 18px rgba(0,234,255,.8);
    }
    .box{
        max-width:460px;
        margin:30px auto;
        background:rgba(255,255,255,.05);
        border-radius:16px;
        border:1px solid rgba(255,255,255,.12);
        padding:24px;
        box-shadow:0 20px 40px rgba(0,0,0,.55);
    }
    .slot-container{
        display:flex;
        justify-content:center;
        gap:14px;
        margin:26px 0;
    }
    .reel{
        width:90px;
        height:110px;       /* görünür pencere yüksekliği */
        overflow:hidden;
        border-radius:14px;
        background:rgba(0,0,0,.55);
        border:1px solid rgba(0,234,255,.4);
        box-shadow:0 0 16px rgba(0,234,255,.35);
        position:relative;
    }
    .reel-strip{
        position:absolute;
        left:0;
        width:100%;
        display:flex;
        flex-direction:column;
        transform:translateY(0);
        transition:transform .6s linear;  /* SABİT HIZ */
    }
    .symbol{
        height:110px;       /* reel pencere yüksekliğiyle aynı */
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:50px;
    }
    button{
        padding:12px 26px;
        font-size:20px;
        border-radius:12px;
        border:none;
        cursor:pointer;
        background:#004a56;
        color:#fff;
        box-shadow:0 0 14px rgba(0,234,255,.35);
        transition:.2s;
    }
    button:disabled{
        opacity:.5;
        cursor:not-allowed;
        box-shadow:none;
    }
    button:hover:not(:disabled){
        background:#007083;
        transform:translateY(-1px);
    }
    .paytable{
        margin-top:18px;
        font-size:13px;
        color:#a8b3bd;
    }
</style>
</head>
<body>

<h1>🎰 Slot Makinesi</h1>

<div class="box">
    <h2>Jeton: <span id="tokens">100</span></h2>
    <p>Bir tur: <b>10 jeton</b></p>

    <div class="slot-container">
        <div class="reel"><div class="reel-strip" id="reel1"></div></div>
        <div class="reel"><div class="reel-strip" id="reel2"></div></div>
        <div class="reel"><div class="reel-strip" id="reel3"></div></div>
    </div>

    <button id="spinBtn" onclick="spin()">Çevir</button>

    <h2 id="result"></h2>

    <div class="paytable">
        <div>3 ⭐ → +50 jeton</div>
        <div>3 🔔 → +30 jeton</div>
        <div>3 🍒 → +20 jeton</div>
        <div>3 aynı sembol → +10 jeton</div>
    </div>
</div>

<a href="/games" style="color:#9df;">← Oyun Lobisine Dön</a>

<script>
/*
  GERÇEK SLOT MANTIĞI:
  - Her reel için sabit bir sembol dizisi (reel strip) var.
  - Rastgele bir "durma indexi" seçiliyor.
  - Reel, strip üzerinde birkaç tur ilerleyip o indexte duruyor.
  - Görünen sembol = strip[durmaIndex].
*/

const SYMBOL_HEIGHT = 110;       // .symbol yüksekliği
const SPIN_ROUNDS_MIN = 3;       // ekstra tur
const SPIN_ROUNDS_MAX = 6;

let tokens = 100;
const COST = 10;

// Her reel için farklı reel strip (gerçek slotlardaki gibi)
const reelStrips = [
  ["🍒","🍋","⭐","🍉","🔔","🍇","🍒","⭐","🍋","🍇","🍒","🔔"],
  ["🍋","🍇","🍒","⭐","🔔","🍉","🍋","🍒","⭐","🍇","🍒","🍉"],
  ["🍉","🍒","🔔","🍋","⭐","🍇","🍉","⭐","🍒","🍋","🔔","🍇"]
];

const reelElements = [
  document.getElementById("reel1"),
  document.getElementById("reel2"),
  document.getElementById("reel3")
];

// Her reel için strip DOM'unu oluştur ve 3 kez üst üste koy (birkaç tur dönebilmek için)
const logicalLen = reelStrips[0].length;
const STRIP_REPEAT = 3;
const currentIndex = [logicalLen, logicalLen, logicalLen]; // ortadan başlasın

for (let i = 0; i < 3; i++) {
  const strip = reelElements[i];
  strip.innerHTML = "";
  for (let r = 0; r < STRIP_REPEAT; r++) {
    reelStrips[i].forEach(sym => {
      const div = document.createElement("div");
      div.className = "symbol";
      div.textContent = sym;
      strip.appendChild(div);
    });
  }
  // başlangıç konumu
  strip.style.transform = `translateY(${-currentIndex[i]*SYMBOL_HEIGHT}px)`;
}

let spinning = false;

function spin() {
  if (spinning) return;

  if (tokens < COST) {
    document.getElementById("result").innerText = "Jetonun bitti!";
    return;
  }

  tokens -= COST;
  document.getElementById("tokens").innerText = tokens;
  document.getElementById("result").innerText = "";
  document.getElementById("spinBtn").disabled = true;
  spinning = true;

  const finalSymbols = [];
  let finished = 0;

  for (let i = 0; i < 3; i++) {
    const strip = reelElements[i];
    const baseIdx = currentIndex[i];
    const reelLen = logicalLen;

    // Rastgele durma indexi (0..reelLen-1)
    const stopIndexLogical = Math.floor(Math.random() * reelLen);

    // Şu anki mod pozisyonunu bul
    const baseMod = baseIdx % reelLen;

    // Şu anki sembolden stopIndex'e olan mesafeyi bul (0..reelLen-1)
    const deltaToStop = (stopIndexLogical - baseMod + reelLen) % reelLen;

    // Reel'in kaç tur döneceğini belirle (3-6 tur)
    const extraRounds = Math.floor(
      Math.random() * (SPIN_ROUNDS_MAX - SPIN_ROUNDS_MIN + 1)
    ) + SPIN_ROUNDS_MIN;

    const totalShift = extraRounds * reelLen + deltaToStop;
    const targetIndex = baseIdx + totalShift;

    currentIndex[i] = targetIndex; // bir sonraki spin için kaydet

    // Önce transition'ı sıfırla ve başlangıç transform'unu uygula
    strip.style.transition = "none";
    strip.style.transform = `translateY(${-baseIdx*SYMBOL_HEIGHT}px)`;

    // reflow zorla
    strip.offsetHeight;

    // Şimdi sabit hızda animasyon
    const duration = 0.6 + i * 0.2; // reel 1,2,3 biraz gecikmeli ama hepsi linear
    strip.style.transition = `transform ${duration}s linear`;
    strip.style.transform = `translateY(${-targetIndex*SYMBOL_HEIGHT}px)`;

    // Her reel bittiğinde sonucu al
    strip.addEventListener("transitionend", function handler(){
      strip.removeEventListener("transitionend", handler);

      const logicalStop = targetIndex % reelLen;
      const sym = reelStrips[i][logicalStop];
      finalSymbols[i] = sym;

      finished++;
      if (finished === 3) {
        evaluateResult(finalSymbols);
      }
    });
  }
}

function evaluateResult(finalSymbols){
  const [s1,s2,s3] = finalSymbols;
  let win = 0;

  if (s1 === s2 && s2 === s3) {
    if (s1 === "⭐") win = 50;
    else if (s1 === "🔔") win = 30;
    else if (s1 === "🍒") win = 20;
    else win = 10;
  }

  const resultEl = document.getElementById("result");
  if (win > 0) {
    tokens += win;
    document.getElementById("tokens").innerText = tokens;
    resultEl.innerText = `Kazandın! +${win} jeton`;
  } else {
    resultEl.innerText = "Kaybettin!";
  }

  spinning = false;
  document.getElementById("spinBtn").disabled = false;
}
</script>

</body>
</html>
