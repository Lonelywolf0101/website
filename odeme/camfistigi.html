<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Ödeme - Çam Fıstığı</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  body{
    font-family:Poppins;
    background:#0b0f14;
    color:white;
    padding:40px;
    text-align:center;
  }
  .box{
    max-width:420px;
    margin:auto;
    padding:25px;
    background:rgba(255,255,255,0.06);
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.1);
  }
  img{width:100%;border-radius:12px;margin-bottom:15px;}
  .btn{
    display:block;
    margin-top:20px;
    padding:12px;
    background:#00eaff;
    color:#000;
    font-weight:700;
    border-radius:10px;
    text-decoration:none;
  }
</style>
</head>
<body>

<div class="box">
  <img src="/images/camfistigi.jpg">
  <h2>Çam Fıstığı (100g)</h2>
  <p>Doğal, yüksek kalite çam fıstığı.</p>
  <h3>450 TL</h3>

  <!-- PayTR linki buraya gelecek -->
  <a class="btn" href="#">Ödemeye Geç</a>
</div>

</body>
</html>
